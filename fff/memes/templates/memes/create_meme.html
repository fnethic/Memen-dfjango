{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="{% url 'home' %}" class="brand">
                <span class="brand-mark">M</span>
                <span>Memelaba</span>
            </a>
            <nav class="nav-links">
                <a href="{% url 'home' %}">Головна</a>
                <a href="{% url 'profile' %}">Профіль</a>
                <a href="{% url 'memes:hippo_meme' %}">Меми</a>
                <a href="{% url 'memes:all_memes' %}">Всі меми</a>
                <a class="active" href="{% url 'memes:create_meme' %}">Створити мем</a>
            </nav>
            <nav class="nav-actions">
                <a href="/admin/" class="button button-ghost">Адмін</a>
                <a href="{% url 'logout' %}">Вийти</a>
            </nav>
        </div>
    </header>

    <main class="auth-shell">
        <div class="auth-card">
            <span class="eyebrow">Новий контент</span>
            <h1>{{ title }}</h1>
            <form method="post" enctype="multipart/form-data" class="styled-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Зберегти мем</button>
            </form>
        </div>
    </main>
</body>
</html>
